<style>

tats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:9px;background:#0a3551;border:1px solid #235f7a;border-radius:10px}.stat label{display:block;color:#9bcddd;font-size:11px}.stat b{display:block;margin-top:4px;font-size:17px}.bar{height:8px;background:#062039;border-radius:8px;overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#5bd9d2,#9cf5d9);width:100%;transition:width .2s}.bar.oxy span{background:linear-gradient(90deg,#ffbd67,#fff0a0)}.shop-list{display:grid;gap:8px}.shop-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px;background:#0a3551;border:1px solid #235f7a;border-radius:10px}.shop-item b{font-size:13px}.shop-item small{display:block;color:#9bcddd;font-size:11px;line-height:1.5;margin-top:3px}.buy{white-space:nowrap;font-size:12px;padding:8px}.tabs{display:flex;gap:6px;padding:10px 10px 0}.tabs button{flex:1;padding:7px 4px;font-size:12px}.tabs button.active{background:linear-gradient(#f5d78b,#dba84b);color:#12344b;border-color:#ffdf8c}.hide{display:none!important}.log{font-size:12px;line-height:1.65;color:#b6deec;max-height:110px;overflow:auto}.log div{border-bottom:1px solid #ffffff0d;padding:3px 0}.mobile-controls{display:none;grid-template-columns:1fr 1fr;gap:12px;align-items:center;padding:12px;background:#082641}.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:4px;justify-content:center}.dpad button{padding:2px;font-size:18px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .rightkey{grid-column:3;grid-row:2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{min-height:42px;font-size:12px}.bottom-note{color:#78a8bd;text-align:center;font-size:11px;padding:12px}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#092e48ed;border:1px solid #7ccfe0;border-radius:20px;padding:8px 14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:2}.toast.show{opacity:1}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#021629b8;padding:18px;z-index:3}.modal{width:min(420px,100%);padding:20px;border:1px solid #59b5d2;background:#0b3453;border-radius:16px;text-align:center;box-shadow:0 12px 40px #00101d}.modal h2{margin:0 0 8px}.modal p{color:#b4deed;font-size:13px;line-height:1.6}.modal button{margin:4px}@media(max-width:820px){.layout{grid-template-columns:1fr}.right{display:grid;grid-template-columns:1fr 1fr;align-items:start}.right .panel:first-child{grid-column:1/-1}.mobile-controls{display:grid}.app{padding:8px}.wallet{width:100%}.pill{flex:1;text-align:center}.scene-tip{font-size:11px}}@media(max-width:440px){.right{grid-template-columns:1fr}.right .panel:first-child{grid-column:auto}.brand .sub{max-width:220px}.pill{font-size:12px;padding:7px 8px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">🐚</div><div><h1>深蓝拾光</h1><div class="sub">DEEP BLUE · 潜入海底，收集属于你的宝藏</div></div></div><div class="wallet"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🎒 <span id="bag">0/12</span></div><div class="pill">📍 <span id="zoneTop">浅海珊瑚湾</span></div></div></header>
<div class="layout"><section class="scene-card"><div class="scene-head"><strong id="zoneName">🌊 浅海珊瑚湾</strong><small id="depth">深度 12m</small></div><div class="canvas-wrap"><canvas id="game" width="640" height="360" aria-label="海底探索游戏画面"></canvas><div class="toast" id="toast"></div><div class="overlay" id="intro"><div class="modal"><div style="font-size:42px">🦦</div><h2>欢迎来到深蓝拾光</h2><p>穿好潜水服，探索闪闪发光的海底世界。收集宝物，回到基地换取金币，再升级装备，潜向更深的海域！</p><button id="start">开始潜水　▶</button><button id="how">玩法说明</button></div></div></div><div class="scene-tip"><span>⌨️ WASD / 方向键移动 · 空格采集 · E 交互</span><span>✨ 靠近发光资源即可采集</span></div><div class="mobile-controls"><div class="dpad"><button class="up" data-move="up">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="down">▼</button><button class="rightkey" data-move="right">▶</button></div><div class="actions"><button id="collectBtn">🫧 采集</button><button id="returnBtn">🏠 返回基地</button><button id="interactBtn">🤝 交互</button><button id="mapBtn">🗺️ 切换海域</button></div></div></section>
<aside class="right"><section class="panel"><h2>🧭 潜水状态</h2><div class="panel-body"><div class="stats"><div class="stat"><label>氧气余量</label><b id="oxygenText">100%</b><div class="bar oxy"><span id="oxygenBar"></span></div></div><div class="stat"><label>采集物品</label><b id="itemCount">0 件</b><div style="font-size:11px;color:#9bcddd;margin-top:6px" id="bagValue">估值 0 金币</div></div><div class="stat"><label>游泳速度</label><b id="speedStat">1 级</b></div><div class="stat"><label>采集工具</label><b id="toolStat">1 级</b></div></div><div style="display:flex;gap:7px;margin-top:10px"><button style="flex:1" id="sellBtn">🪙 出售全部</button><button style="flex:1" id="saveBtn">💾 保存进度</button></div></div></section>
<section class="panel"><h2>🧰 基地工坊</h2><div class="tabs"><button class="active" data-tab="upgrade">装备升级</button><button data-tab="market">资源图鉴</button><button data-tab="missions">探索任务</button></div><div class="panel-body"><div id="upgradePanel" class="shop-list"></div><div id="marketPanel" class="shop-list hide"></div><div id="missionsPanel" class="shop-list hide"></div></div></section>
<section class="panel"><h2>📜 潜水日志</h2><div class="panel-body"><div class="log" id="log"><div>欢迎来到浅海珊瑚湾！海底有许多闪亮的资源。</div></div></div></section></aside></div><div class="bottom-note">原创休闲像素游戏 · 自动保存在当前浏览器 · 适合手机与电脑</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const zones=[{name:'浅海珊瑚湾',emoji:'🌊',depth:12,unlock:0,bg:'#0a7395',floor:'#13576b',items:['shell','seaweed','pearl'],desc:'阳光穿过海面，贝壳藏在珊瑚旁。'},{name:'幽蓝水晶洞',emoji:'💎',depth:48,unlock:180,bg:'#263d87',floor:'#202b60',items:['crystal','pearl','relic'],desc:'幽蓝晶体在岩洞深处闪烁。'},{name:'深海遗迹',emoji:'🏛️',depth:105,unlock:650,bg:'#252b58',floor:'#171d3d',items:['relic','crystal','goldpearl'],desc:'沉睡的遗迹里藏着古老宝藏。'}];
const resources={shell:{name:'彩纹贝壳',emoji:'🐚',value:8,color:'#ffc4a5',rarity:'普通'},seaweed:{name:'荧光海草',emoji:'🌿',value:6,color:'#8de7b0',rarity:'普通'},pearl:{name:'月光珍珠',emoji:'🫧',value:22,color:'#e3fbff',rarity:'稀有'},crystal:{name:'蓝晶碎片',emoji:'💎',value:34,color:'#7ee6ff',rarity:'稀有'},relic:{name:'古代遗物',emoji:'🏺',value:65,color:'#f6d18b',rarity:'珍贵'},goldpearl:{name:'深海金珠',emoji:'🌟',value:120,color:'#ffdb70',rarity:'传说'}};
const fresh=()=>({coins:35,oxygenLv:1,speedLv:1,toolLv:1,bagLv:1,zone:0,x:100,y:170,oxygen:100,inventory:[],discovered:[],missions:{collect:0,sell:0,deep:0},totalSold:0,totalCollected:0,started:false});let s;try{s={...fresh(),...JSON.parse(localStorage.getItem('deepblue-save-v2')||'{}')};if(!Array.isArray(s.inventory))s.inventory=[]}catch{s=fresh()};s.zone=Math.min(2,Math.max(0,s.zone||0));let keys={},move={x:0,y:0},objects=[],bubbles=[],particles=[],tick=0,last=0,toastTimer,collectCooldown=0;
const save=()=>{try{localStorage.setItem('deepblue-save-v2',JSON.stringify(s));say('进度已保存！')}catch{say('当前浏览器无法保存进度')}};function log(t){const d=document.createElement('div');d.textContent='› '+t;$('log').prepend(d);while($('log').children.length>8)$('log').lastChild.remove()}function say(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
function upgradeCost(k){return Math.floor(({oxygen:45,speed:55,tool:65,bag:50}[k])*Math.pow(({oxygen:1.7,speed:1.85,tool:1.9,bag:1.75}[k]),s[k+'Lv']-1))}function level(k){return s[k+'Lv']}function inventoryValue(){return s.inventory.reduce((a,it)=>a+resources[it.type].value,0)}function cap(){return 8+s.bagLv*4}function updateUI(){ $('coins').textContent=Math.floor(s.coins);$('bag').textContent=s.inventory.length+'/'+cap();$('zoneTop').textContent=zones[s.zone].name;$('zoneName').textContent=zones[s.zone].emoji+' '+zones[s.zone].name;$('depth').textContent='深度 '+zones[s.zone].depth+'m';$('oxygenText').textContent=Math.ceil(s.oxygen)+'%';$('oxygenBar').style.width=Math.max(0,s.oxygen)+'%';$('itemCount').textContent=s.inventory.length+' 件';$('bagValue').textContent='估值 '+inventoryValue()+' 金币';$('speedStat').textContent=s.speedLv+' 级';$('toolStat').textContent=s.toolLv+' 级';renderShop();}
const upgrades=[['oxygen','氧气罐','延长潜水时间',()=>upgradeCost('oxygen'),()=>s.oxygenLv+' 级 · 氧气上限 '+(100+(s.oxygenLv-1)*25)+'%',()=>s.oxygenLv++],['speed','推进脚蹼','游得更快，探索更轻松',()=>upgradeCost('speed'),()=>s.speedLv+' 级 · 移动速度提升',()=>s.speedLv++],['tool','采集工具','扩大采集范围并提高效率',()=>upgradeCost('tool'),()=>s.toolLv+' 级 · 采集范围 '+(30+s.toolLv*5),()=>s.toolLv++],['bag','防水背包','可以携带更多宝物',()=>upgradeCost('bag'),()=>s.bagLv+' 级 · 容量 '+cap()+' 件',()=>s.bagLv++]];
function renderShop(){ $('upgradePanel').innerHTML='';upgrades.forEach(([key,name,desc,cost,detail,buy])=>{let c=cost(),el=document.createElement('div');el.className='shop-item';el.innerHTML=`<div><b>${name}</b><small>${desc}<br>${detail()}</small></div><button class="buy" ${s.coins<c?'disabled':''}>🪙 ${c}</button>`;el.querySelector('button').onclick=()=>{if(s.coins<c)return;s.coins-=c;buy();if(key==='oxygen')s.oxygen=100;log('升级成功：'+name);updateUI();saveSilent()};$('upgradePanel').append(el)});$('marketPanel').innerHTML=Object.values(resources).map(r=>`<div class="shop-item"><div><b>${r.emoji} ${r.name}</b><small>${r.rarity} · 售价 ${r.value} 金币</small></div><span style="font-size:12px;color:#b7e9f3">${s.discovered.includes(r.name)?'已发现':'待发现'}</span></div>`).join('');let ms=[['collect','收集 5 件资源','探索海底，累计收集 5 件',5,30],['sell','出售价值 100 金币','累计出售资源价值达到 100',100,45],['deep','解锁幽蓝水晶洞','前往第二片海域探索',1,60]];$('missionsPanel').innerHTML=ms.map(([key,title,desc,target,reward])=>{let val=key==='collect'?s.totalCollected:key==='sell'?s.totalSold:s.zone>=1?1:0,done=val>=target;return `<div class="shop-item"><div><b>${done?'✅':'🎯'} ${title}</b><small>${desc}<br>进度 ${Math.min(val,target)}/${target} · 奖励 ${reward} 金币</small></div><button class="buy" ${done?'disabled':''} data-mission="${key}">${done?'已完成':'领取任务'}</button></div>`}).join('');$('missionsPanel').querySelectorAll('button').forEach(b=>b.onclick=()=>{let key=b.dataset.mission;if(key==='collect'&&s.totalCollected<5||key==='sell'&&s.totalSold<100||key==='deep'&&s.zone<1){say('任务还没有完成哦');return}let reward={collect:30,sell:45,deep:60}[key];if(s.missions[key+'_claimed'])return;s.missions[key+'_claimed']=true;s.coins+=reward;log('完成任务，获得 '+reward+' 金币');updateUI();saveSilent()})}
function saveSilent(){try{localStorage.setItem('deepblue-save-v2',JSON.stringify(s))}catch{}}
function spawn(){objects=[];let z=zones[s.zone];for(let i=0;i<12;i++){let type=z.items[Math.floor(Math.random()*z.items.length)];objects.push({x:45+Math.random()*550,y:65+Math.random()*235,type,phase:Math.random()*6.28,got:false})}bubbles=Array.from({length:32},()=>({x:Math.random()*640,y:Math.random()*360,r:1+Math.random()*2,spd:.2+Math.random()*.65}))}spawn();
function draw(){let z=zones[s.zone];let g=ctx.createLinearGradient(0,0,0,360);g.addColorStop(0,z.bg);g.addColorStop(1,'#061c3b');ctx.fillStyle=g;ctx.fillRect(0,0,640,360);
// sun rays / water caustics
for(let i=0;i<6;i++){ctx.fillStyle=`rgba(140,238,255,${.025+Math.sin(tick*.01+i)*.015})`;ctx.beginPath();ctx.moveTo(80+i*100,0);ctx.lineTo(115+i*100,0);ctx.lineTo(210+i*65,300);ctx.lineTo(170+i*65,300);ctx.fill()}
// distant rock silhouettes
ctx.fillStyle=z.floor;ctx.beginPath();ctx.moveTo(0,310);for(let x=0;x<=640;x+=32)ctx.lineTo(x,292+Math.sin(x*.035+tick*.004)*13);ctx.lineTo(640,360);ctx.lineTo(0,360);ctx.fill();
// coral / kelp pixels
for(let i=0;i<10;i++){let x=(i*71+15)%640,y=315+(i%3)*7;ctx.fillStyle=i%2?'#e87889':'#38b9a9';for(let j=0;j<4;j++){ctx.fillRect(x+j*4,y-j*8-(j%2)*5,4,9);ctx.fillRect(x-4,y-12,4,5)}}
// background ruin columns in deeper zones
if(s.zone>0){ctx.fillStyle='#9ac8e51e';for(let i=0;i<5;i++){ctx.fillRect(60+i*125,210+(i%2)*22,18,100);ctx.fillRect(50+i*125,207+(i%2)*22,38,7)}}
// bubbles
bubbles.forEach(b=>{b.y-=b.spd;if(b.y<0){b.y=360;b.x=Math.random()*640}ctx.strokeStyle='#b5f6ff70';ctx.strokeRect(Math.round(b.x),Math.round(b.y),b.r*2,b.r*2)});
// resources
objects.forEach(o=>{if(o.got)return;let bob=Math.sin(tick*.055+o.phase)*3;ctx.fillStyle=resources[o.type].color+'22';ctx.fillRect(o.x-13,o.y+bob-13,26,26);ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(resources[o.type].emoji,o.x,o.y+bob+7);if(Math.hypot(s.x-o.x,s.y-o.y)<45){ctx.strokeStyle='#e4ffffaa';ctx.strokeRect(o.x-14,o.y+bob-15,28,28)}});
// player shadow
ctx.fillStyle='#00132366';ctx.fillRect(s.x-15,s.y+16,30,5);let bob=Math.sin(tick*.09)*2;ctx.save();ctx.translate(Math.round(s.x),Math.round(s.y+bob));if(move.x<0)ctx.scale(-1,1);
// tail
ctx.fillStyle='#a5d8c6';ctx.fillRect(-19,-1,7,7);ctx.fillRect(-24,2,6,5);
// flippers
ctx.fillStyle='#e0b46b';ctx.fillRect(-8,9,8,5);ctx.fillRect(4,9,8,5);
// body suit
ctx.fillStyle='#f3c987';ctx.fillRect(-12,-9,24,20);ctx.fillStyle='#3c8d9d';ctx.fillRect(-10,-7,20,15);ctx.fillStyle='#f2c28a';ctx.fillRect(-14,-7,7,13);ctx.fillRect(7,-7,7,13);
// head + ears
ctx.fillStyle='#c58c61';ctx.fillRect(-11,-19,22,15);ctx.fillRect(-13,-17,5,6);ctx.fillRect(8,-17,5,6);ctx.fillStyle='#ffe0ae';ctx.fillRect(-7,-13,14,8);ctx.fillStyle='#142f49';ctx.fillRect(3,-12,3,3);ctx.fillRect(-7,-9,3,2);
// helmet
ctx.strokeStyle='#9fe8f5';ctx.lineWidth=2;ctx.strokeRect(-14,-22,28,25);ctx.fillStyle='#7ddcf633';ctx.fillRect(-12,-20,24,20);ctx.fillStyle='#eaffff';ctx.fillRect(-8,-19,5,2);ctx.restore();
// HUD objective
ctx.fillStyle='#05213abf';ctx.fillRect(12,12,180,36);ctx.fillStyle='#e5fbff';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText(s.zone===0?'目标：收集贝壳与珍珠':s.zone===1?'目标：寻找蓝晶碎片':'目标：发现古代遗物',22,27);ctx.fillStyle='#a6d9e8';ctx.fillText('靠近宝物后按空格采集',22,41);
// base portal
ctx.fillStyle='#c5f8ff';ctx.fillRect(12,165,4,42);ctx.fillStyle='#69cbe5';ctx.fillRect(16,171,7,30);ctx.fillStyle='#e7ffff';ctx.font='10px system-ui';ctx.fillText('基地入口',10,157);
}
function collect(){if(collectCooldown>0)return;collectCooldown=12;let near=objects.filter(o=>!o.got&&Math.hypot(s.x-o.x,s.y-o.y)<(35+s.toolLv*5)).sort((a,b)=>Math.hypot(s.x-a.x,s.y-a.y)-Math.hypot(s.x-b.x,s.y-b.y))[0];if(!near){say('再靠近一点，寻找发光资源');return}if(s.inventory.length>=cap()){say('背包满啦！返回基地出售资源');return}near.got=true;s.inventory.push({type:near.type});s.totalCollected++;if(!s.discovered.includes(resources[near.type].name))s.discovered.push(resources[near.type].name);for(let i=0;i<7;i++)particles.push({x:near.x,y:near.y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:24,color:resources[near.type].color});say('收集到 '+resources[near.type].name+'！');log('发现 '+resources[near.type].name+'，估值 '+resources[near.type].value+' 金币');if(objects.every(o=>o.got))spawn();updateUI();saveSilent()}
function sell(){if(!s.inventory.length){say('背包里还没有资源');return}let val=inventoryValue(),count=s.inventory.length;s.coins+=val;s.totalSold+=val;s.inventory=[];log('出售 '+count+' 件资源，获得 '+val+' 金币');say('交易成功！+'+val+' 金币');updateUI();saveSilent()}
function returnBase(){s.x=60;s.y=185;s.oxygen=100;s.inventory.length&&say('已返回基地，记得出售资源');if(!s.inventory.length)say('氧气已补满，准备再次出发');log('返回基地，氧气已补充');updateUI();saveSilent()}
function switchZone(){let next=(s.zone+1)%zones.length;if(next===1&&s.coins<180||next===2&&s.coins<650){say('需要更多金币才能解锁这片海域');return}if(next===1&&s.zone===0&&s.coins>=180)s.coins-=180;if(next===2&&s.zone===1&&s.coins>=650)s.coins-=650;s.zone=next;s.x=90;s.y=175;s.oxygen=100;spawn();log('潜入新海域：'+zones[next].name+'。'+zones[next].desc);say('欢迎来到'+zones[next].name);updateUI();saveSilent()}
function interact(){if(s.x<60){returnBase();return}if(Math.hypot(s.x-35,s.y-185)<60){returnBase();return}if(s.inventory.length>=cap())sell();else collect()}
function frame(now){let dt=Math.min(2,(now-last)/16.67||1);last=now;tick+=dt;if(s.started&&!$('intro').classList.contains('hide')){}if(s.started){s.oxygen-=.018*dt;if(s.oxygen<=0){s.oxygen=0;returnBase();say('氧气不足，已自动救援回基地');}let dx=move.x,dy=move.y;if(keys.ArrowLeft||keys.a)dx=-1;if(keys.ArrowRight||keys.d)dx=1;if(keys.ArrowUp||keys.w)dy=-1;if(keys.ArrowDown||keys.s)dy=1;let mag=Math.hypot(dx,dy)||1;s.x=Math.max(25,Math.min(615,s.x+dx/mag*(1.25+s.speedLv*.42)*dt));s.y=Math.max(60,Math.min(320,s.y+dy/mag*(1.25+s.speedLv*.42)*dt));if(keys[' ']||keys.Space)collect();if(collectCooldown>0)collectCooldown-=dt;}particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='m')switchZone();if(e.key.toLowerCase()==='h')returnBase()});window.addEventListener('keyup',e=>keys[e.key]=false);document.querySelectorAll('[data-move]').forEach(b=>{let dir=b.dataset.move;const set=v=>{move.x=0;move.y=0;if(v){move.x=dir==='left'?-1:dir==='right'?1:0;move.y=dir==='up'?-1:dir==='down'?1:0}};b.addEventListener('pointerdown',e=>{e.preventDefault();set(true)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>set(false)))});
$('collectBtn').onclick=collect;$('returnBtn').onclick=returnBase;$('interactBtn').onclick=interact;$('mapBtn').onclick=switchZone;$('sellBtn').onclick=sell;$('saveBtn').onclick=save;$('start').onclick=()=>{$('intro').classList.add('hide');s.started=true;log('开始潜水！靠近资源按空格或点击采集。');saveSilent()};$('how').onclick=()=>say('移动探索 → 靠近资源采集 → 回基地出售 → 升级装备 → 解锁海域');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['upgrade','market','missions'].forEach(k=>$(k+'Panel').classList.toggle('hide',k!==b.dataset.tab))});
if(s.started)$('intro').classList.add('hide');else $('intro').classList.remove('hide');updateUI();requestAnimationFrame(frame);
// PWA registration only on secure hosting
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
